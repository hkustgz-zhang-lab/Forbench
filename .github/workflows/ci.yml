name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  full-source-build:
    name: Full source build (${{ matrix.ubuntu }})
    runs-on: ${{ matrix.ubuntu }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - ubuntu-22.04
          - ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            default-jre \
            git \
            libfl-dev \
            libboost-all-dev \
            libgmp-dev \
            libmpfr-dev \
            m4 \
            perl \
            pkg-config \
            python3-dev \
            python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install meson ninja toml

      - name: Diagnose GMP download connectivity
        run: |
          set -u
          echo "Runner: ${RUNNER_OS:-unknown} ${ImageOS:-unknown}"
          echo "DNS records for gmplib.org:"
          getent ahosts gmplib.org || true
          echo "IPv4 connectivity to gmplib.org:"
          curl -4 --head --location --connect-timeout 10 \
            https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz || true
          echo "IPv6 connectivity to gmplib.org:"
          curl -6 --head --location --connect-timeout 10 \
            https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz || true

      - name: Ensure Bitwuzla math dependencies
        env:
          MATH_PREFIX: ${{ runner.temp }}/smt-switch-math
        run: |
          set -euxo pipefail
          mkdir -p "$MATH_PREFIX"
          export PKG_CONFIG_PATH="$MATH_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          if ! pkg-config --atleast-version=6.3 gmp; then
            curl --fail --location --retry 3 \
              --output "$RUNNER_TEMP/gmp-6.3.0.tar.xz" \
              https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
            tar -xf "$RUNNER_TEMP/gmp-6.3.0.tar.xz" -C "$RUNNER_TEMP"
            cd "$RUNNER_TEMP/gmp-6.3.0"
            ./configure --prefix="$MATH_PREFIX" --enable-cxx
            make -j"$(nproc)"
            make install
          fi

          gmp_prefix=$(pkg-config --variable=prefix gmp)
          if ! pkg-config --atleast-version=4.2.1 mpfr; then
            curl --fail --location --retry 3 \
              --output "$RUNNER_TEMP/mpfr-4.2.1.tar.xz" \
              https://www.mpfr.org/mpfr-4.2.1/mpfr-4.2.1.tar.xz
            tar -xf "$RUNNER_TEMP/mpfr-4.2.1.tar.xz" -C "$RUNNER_TEMP"
            cd "$RUNNER_TEMP/mpfr-4.2.1"
            ./configure --prefix="$MATH_PREFIX" --with-gmp="$gmp_prefix"
            make -j"$(nproc)"
            make install
          fi

          pkg-config --atleast-version=6.3 gmp
          pkg-config --atleast-version=4.2.1 mpfr
          pkg-config --modversion gmp
          pkg-config --modversion mpfr
          {
            echo "PKG_CONFIG_PATH=$MATH_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "CMAKE_PREFIX_PATH=$MATH_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
            echo "LD_LIBRARY_PATH=$MATH_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Restore dependency cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/glog
            deps/bison
            deps/flex
            deps/btor2tools
            deps/smt-switch
            deps/vexpparser
          key: ${{ runner.os }}-${{ matrix.ubuntu }}-deps-gmp-6.3.0-mpfr-4.2.1-${{ hashFiles('contrib/setup-*.sh', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ubuntu }}-deps-gmp-6.3.0-mpfr-4.2.1-

      - name: Build missing dependencies
        env:
          NPROC: 2
        run: |
          set -euxo pipefail
          export NPROC="$(nproc)"

          test -x deps/bison/bison-install/bin/bison \
            || ./contrib/setup-bison.sh

          test -x deps/flex/flex-install/bin/flex \
            || ./contrib/setup-flex.sh

          test -f deps/glog/install/lib/libglog.a \
            || ./contrib/setup-glog.sh

          test -f deps/btor2tools/build/lib/libbtor2parser.a \
            || ./contrib/setup-btor2tools.sh

          test -f deps/smt-switch/local/lib/libsmt-switch-bitwuzla.a \
            || ./contrib/setup-smt-switch.sh

          test -f deps/vexpparser/build/src/libvexpparser.a \
            || ./contrib/setup-vexpparser.sh

      - name: Configure Forbench
        run: ./configure.sh --python

      - name: Build Forbench
        run: cmake --build build --parallel "$(nproc)"

      - name: Check Python syntax
        run: python3 -m py_compile test/python/pywasim.py test/python/pywasim_async.py test/python/pywasim_log.py

      - name: Run Python smoke tests
        working-directory: test/python
        run: |
          set -euxo pipefail
          python3 test_adder.py
          python3 test_async.py
          python3 test_async_comb.py
          python3 test_async_br1.py
